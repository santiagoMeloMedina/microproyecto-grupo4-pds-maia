<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panorama general de los retrasos - miniatura</title>
    <script src="https://cdn.plot.ly/plotly-4.0.0.min.js" integrity="sha256-FEYfO0yRyLtZCpnW0Dw/0DHKQO7Afrq3ml4+rBB818o=" crossorigin="anonymous"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #0D1B2A; }
      #thumb-chart { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="thumb-chart"></div>
    <script>
        Plotly.newPlot(
            "thumb-chart",
            [{"direction": "clockwise", "hole": 0.68, "hovertemplate": "%{label}<br>%{value:,} vuelos<br>%{percent}<extra></extra>", "labels": ["Con retraso", "Sin retraso"], "marker": {"colors": ["#FF7A59", "#5BC0BE"], "line": {"color": "#0D1B2A", "width": 4}}, "sort": false, "textinfo": "none", "values": [240263, 299116], "type": "pie"}],
            {"showlegend": false, "annotations": [{"font": {"color": "#E5EDF5", "family": "Inter, Segoe UI, sans-serif", "size": 20}, "showarrow": false, "text": "<b>44.5%</b><br><span style='font-size:10px'>con retraso</span>", "x": 0.5, "y": 0.5}], "margin": {"l": 6, "r": 6, "t": 6, "b": 6}, "font": {"family": "Inter, Segoe UI, sans-serif", "color": "#E5EDF5", "size": 11}, "hoverlabel": {"font": {"color": "#E5EDF5"}, "bgcolor": "#183248"}, "paper_bgcolor": "#0D1B2A", "plot_bgcolor": "#0D1B2A"},
            {"displayModeBar": false, "responsive": true}
        );
    </script>
</body>
</html>
