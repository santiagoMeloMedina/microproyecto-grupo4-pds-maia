server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El tablero enruta del lado del cliente con react-router. Sin este
    # try_files, recargar /franjas o /prediccion devolveria 404, porque en el
    # disco no existe un archivo con ese nombre.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite pone un hash en el nombre de cada archivo compilado, asi que se
    # pueden cachear indefinidamente: un cambio genera otro nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
