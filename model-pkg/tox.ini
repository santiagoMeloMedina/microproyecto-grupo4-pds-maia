# Automatizacion del paquete del modelo, en la linea del taller 5.
#
#   tox run -e train          entrena el pipeline y lo guarda dentro del paquete
#   tox run -e test_package   entrena y corre las pruebas unitarias
#   tox run -e typechecks     verificacion estatica de tipos
#
# Cada ambiente crea su propio virtualenv, de modo que el resultado no depende
# de lo que haya instalado en la maquina de quien lo ejecuta.

[tox]
min_version = 4
envlist = test_package
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
allowlist_externals = *
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
passenv =
    AIRLINES_CSV
    XGBOOST_DEVICE

[testenv:train]
envdir = {toxworkdir}/train
deps = -r requirements/requirements.txt
commands = python model_riesgo_retraso/train_pipeline.py

[testenv:test_package]
envdir = {toxworkdir}/test_package
deps = -r requirements/test_requirements.txt
commands =
    python model_riesgo_retraso/train_pipeline.py
    pytest -s -vv {posargs:tests/}

[testenv:typechecks]
envdir = {toxworkdir}/test_package
deps = {[testenv:test_package]deps}
commands = mypy model_riesgo_retraso
