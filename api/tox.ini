# Automatizacion de la API, en la linea del taller 6.
#
#   tox run -e test_app   instala dependencias y corre las pruebas de la API
#   tox run -e run        levanta el servidor uvicorn en el puerto 8002
#
# Ambos ambientes instalan model_riesgo_retraso desde el wheel de
# model-package/, de modo que las pruebas se ejecuten contra el mismo artefacto
# que se despliega y no contra un modelo cargado a mano desde el repositorio.

[tox]
min_version = 4
envlist = test_app
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
allowlist_externals = *
setenv =
    PYTHONPATH = .
    PYTHONHASHSEED = 0
passenv =
    AIRLINES_PARQUET

[testenv:test_app]
envdir = {toxworkdir}/test_app
deps = -r test_requirements.txt
commands = pytest -vv {posargs:tests/}

[testenv:run]
envdir = {toxworkdir}/test_app
deps = {[testenv:test_app]deps}
setenv = {[testenv]setenv}
commands = python app/main.py
